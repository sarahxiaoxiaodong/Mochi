<!DOCTYPE html>
<html lang="en">
<head>
    <title>Color Flipper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h3>Color Flipper System</h3>
    <button id="pink" onclick="setColor('#ffdbe1')">Pink</button>
    <button id="blue" onclick="setColor('hwb(197 80% 0%)')">Blue</button>
    <button id="yellow" onclick="setColor('lightyellow')">Yellow</button>
    <button id="random" onclick="setColor(randomColor())">Random</button>
    <script src="script.js"></script>
</body>
</html>
